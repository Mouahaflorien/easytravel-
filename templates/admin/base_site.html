{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | {{ site_title|default:_('EasyTravel Admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 10px;">
        <img src="{% static 'images/logo_mslogitech.png' %}" alt="Mslogitech Logo" style="height: 40px; border-radius: 5px; background: white; padding: 2px;">
        <span style="color: #fff; font-weight: bold;">{{ site_header|default:_('Administration Mslogitech') }}</span>
    </a>
</h1>
{% endblock %}

{% block nav-global %}{% endblock %}
