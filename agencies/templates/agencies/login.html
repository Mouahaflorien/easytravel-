<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Agence - Espace Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.15);
            border-color: #3b82f6;
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .btn-primary {
            background: #2563eb;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover, .btn-primary:focus {
            background: #1d4ed8 !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45) !important;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            background: #1e40af !important;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h3 class="text-white fw-bold mb-1">Portail Agence</h3>
        <p class="text-light opacity-75 mb-4">Connectez-vous à votre espace sécurisé</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label text-white small fw-bold">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white small fw-bold">Mot de passe</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            {% if form.errors %}
            <div class="alert alert-danger py-2 small border-0" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;">
                Identifiants incorrects.
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary w-100 mt-2">Accéder au Dashboard</button>
        </form>
    </div>
</body>
</html>
