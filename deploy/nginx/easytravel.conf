# ==============================================================================
# CONFIGURATION NGINX OFFICIELLE EASYTRAVEL (SERVEUR CONTABO / UBUNTU)
# ==============================================================================
# Emplacement sur le serveur : /etc/nginx/sites-available/easytravel.conf
# Lien d'activation : sudo ln -s /etc/nginx/sites-available/easytravel.conf /etc/nginx/sites-enabled/

upstream easytravel_app {
    server unix:/run/easytravel/gunicorn.sock fail_timeout=0;
}

# 1. Redirection automatique HTTP vers HTTPS (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name easytravel.cm www.easytravel.cm;

    # Défi Certbot Let's Encrypt (renouvellement de certificat SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur Principal Sécurisé HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easytravel.cm www.easytravel.cm;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/easytravel.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easytravel.cm/privkey.pem;

    # Paramètres SSL stricts recommandés par Mozilla Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # En-têtes de sécurité HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Limite taille upload (photos bus, logos agences, pièces d'identité)
    client_max_body_size 25M;

    # Logs Nginx
    access_log /var/log/nginx/easytravel_access.log;
    error_log /var/log/nginx/easytravel_error.log warn;

    # Compression Gzip pour performances optimales
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Fichiers statiques Django (WhiteNoise / Nginx direct delivery)
    location /static/ {
        alias /var/www/easytravel/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Fichiers Médias uploadés (logos agences, justificatifs)
    location /media/ {
        alias /var/www/easytravel/media/;
        expires 7d;
        access_log off;
        # Interdire l'exécution de scripts malveillants dans /media/
        location ~ \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # Défi Certbot pour renouvellement
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy vers l'application Django Gunicorn
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;

        proxy_pass http://easytravel_app;
    }
}
